services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      UPLOADS_DIR: "/app/uploads"
      OUTPUT_DIR: "/app/output"
      MAX_FILE_SIZE_BYTES: "52428800"
      FREE_TIER_MAX_SLIDES: "10"
      PAID_TIER_MAX_SLIDES: "1000"
      BROWSER_TIMEOUT_MS: "60000"
      SLIDE_WAIT_MS: "2000"
      EMAIL_ENABLED: "false"
    volumes:
      - uploads:/app/uploads
      - output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads:
  output:
