services:
  docsend2pdf:
    container_name: docsend2pdf
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - docsend2pdf.net
    expose:
      - "4000"
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      UPLOADS_DIR: "/app/uploads"
      OUTPUT_DIR: "/app/output"
      MAX_FILE_SIZE_BYTES: "52428800"
      FREE_TIER_MAX_SLIDES: "10"
      MEMBER_TIER_MAX_SLIDES: "1000"
      BROWSER_TIMEOUT_MS: "60000"
      SLIDE_WAIT_MS: "2000"
      # ---- Auth (free vs signed-in member tier) ----
      DB_PATH: "/app/data/app.db"
      # Set true when serving over HTTPS through nginx.
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      # Public origin of the app, used in email verification links.
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:4000}"
      # Leave GOOGLE_CLIENT_ID/SECRET empty to hide the Google sign-in button.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      # EMAIL_ENABLED=true requires SMTP_* below; otherwise signup auto-verifies
      # and the verification link is printed to the container log (dev mode).
      EMAIL_ENABLED: "${EMAIL_ENABLED:-true}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      FROM_ADDRESS: "${FROM_ADDRESS:-noreply@docsend-to-pdf.online}"
    volumes:
      - uploads:/app/uploads
      - output:/app/output
      - appdata:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads:
  output:
  appdata:

networks:
  docsend2pdf.net:
    name: docsend2pdf.net
    driver: bridge